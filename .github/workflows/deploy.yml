name: Deploy

# Backend pipeline: verify -> deploy-staging -> deploy-prod (manual approval).
#
#   push to dev/launch-readiness   verify, then staging, then production once
#                                  the `production` environment is approved
#   pull request to the same       verify only (no secrets, nothing deployed)
#
# The release package is built ONCE in `verify` and the same zip is deployed to
# staging and then to production, so production runs the bytes staging ran.
#
# One-time setup (repo admin / Will). None of this exists until someone does it:
#   1. Entra app registration `floorplan-deploy` with two federated credentials
#      (issuer https://token.actions.githubusercontent.com, audience
#      api://AzureADTokenExchange), one per GitHub environment, subjects
#        repo:<owner>/<repo>:environment:staging
#        repo:<owner>/<repo>:environment:production
#   2. Give that app's service principal `Website Contributor` on rpcc-api-staging
#      and on rpcc-api2 (deploy + app settings), and read access to the resource
#      group. Nothing wider.
#   3. Repository secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#   4. GitHub environments `staging` and `production`. On `production`, add
#      Connor as a required reviewer (Settings > Environments > production >
#      Required reviewers; leave "Prevent self-review" off while Connor is both
#      the pusher and the reviewer). Restrict both environments to the branch
#      dev/launch-readiness.
#   5. Environment variable AZURE_RESOURCE_GROUP on each environment.
#      For the migration dry-run once scripts/migrate.cjs exists: SQL_SERVER and
#      SQL_DATABASE on each environment, and a contained database user for the
#      floorplan-deploy principal with db_datareader (read schema_migrations).
#
# Migrations are NOT applied by this workflow. Will applies them with
# `npm run migrate -- --apply` per the runbook, before approving production.

on:
  push:
    branches: [dev/launch-readiness]
  pull_request:
    branches: [dev/launch-readiness]

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_sha: ${{ steps.meta.outputs.sha }}
      build_time: ${{ steps.meta.outputs.time }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # .npmrc sets ignore-scripts=true, so no dependency lifecycle script runs.
      - name: Install from the lockfile
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx jest --ci

      # The one high advisory today (brace-expansion via exceljs -> archiver ->
      # minimatch) is unreachable, so high is reported and critical blocks,
      # exactly as in security.yml. Drop continue-on-error once exceljs no longer
      # pulls it in so that high blocks the deploy too.
      - name: Audit production dependencies (high, informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Audit production dependencies (critical, blocking)
        run: npm audit --omit=dev --audit-level=critical

      # Every http route needs a role check or a reason to be public. The
      # frontend-calls-match-backend comparison is a separate command in the
      # frontend repo (scripts/check-api-calls.cjs --backend <this checkout>).
      - name: Every route has a role check
        run: node scripts/check-routes.cjs

      - name: Build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # `build` starts with rm -rf dist, so deleted sources cannot keep deploying
      # from stale output.
      - name: Build
        run: npm run build

      # Fresh production-only install from the lockfile into a clean folder, so
      # the zip holds exactly what the Function App needs (dist, production
      # node_modules, migrations/ for the startup check, host.json) and nothing
      # from the working tree (docs, plans, Azurite files, dev dependencies).
      - name: Assemble release package
        if: github.event_name == 'push'
        run: |
          mkdir release
          cp -r dist migrations release/
          cp host.json package.json package-lock.json .npmrc release/
          if [ -f scripts/migrate.cjs ]; then
            mkdir release/scripts
            cp scripts/migrate.cjs release/scripts/
          fi
          (cd release && npm ci --omit=dev)
          (cd release && zip -qry ../release.zip .)

      - name: Upload release package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.zip
          if-no-files-found: error
          retention-days: 14

  deploy-staging:
    name: Deploy to staging
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      APP_NAME: rpcc-api-staging
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Unpack release package
        run: unzip -q release.zip -d release

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.APP_NAME }}
          package: release

      # /api/health?deep=true reports these as `commit` and `builtAt`. --output none
      # matters: without it the command prints every app setting, secrets included.
      - name: Stamp build metadata
        run: |
          az functionapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings "BUILD_SHA=${{ needs.verify.outputs.build_sha }}" "BUILD_TIME=${{ needs.verify.outputs.build_time }}" \
            --output none

      - name: Smoke test
        run: |
          host=$(az functionapp show --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query defaultHostName --output tsv)
          curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors "https://${host}/api/health"

      # Read-only: lists the migrations the database has not recorded yet. Does
      # not apply anything. Inert until Will's scripts/migrate.cjs is on this
      # branch; then it needs SQL_SERVER / SQL_DATABASE (see setup, point 5).
      - name: Pending migrations (dry run)
        if: hashFiles('release/scripts/migrate.cjs') != ''
        continue-on-error: true
        shell: bash
        working-directory: release
        env:
          SQL_SERVER: ${{ vars.SQL_SERVER }}
          SQL_DATABASE: ${{ vars.SQL_DATABASE }}
        run: |
          npm run migrate -- --dry-run | tee "$RUNNER_TEMP/pending-migrations.txt"
          {
            echo "### Pending migrations on ${APP_NAME}"
            echo '```'
            cat "$RUNNER_TEMP/pending-migrations.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy to production
    needs: [verify, deploy-staging]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers are configured on this environment in repo settings.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      APP_NAME: rpcc-api2
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      # Runs after approval. A run left waiting while newer commits reached
      # staging must not put older code on top of newer code in production; to
      # roll back, revert on the branch and let the new commit take the same path.
      - name: Refuse a commit that is no longer the branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::${GITHUB_SHA::7} is not the head of ${GITHUB_REF_NAME} (${head::7}). Reject this run and approve the newest one."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Unpack release package
        run: unzip -q release.zip -d release

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.APP_NAME }}
          package: release

      - name: Stamp build metadata
        run: |
          az functionapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings "BUILD_SHA=${{ needs.verify.outputs.build_sha }}" "BUILD_TIME=${{ needs.verify.outputs.build_time }}" \
            --output none

      - name: Smoke test
        run: |
          host=$(az functionapp show --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query defaultHostName --output tsv)
          curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors "https://${host}/api/health"

      - name: Pending migrations (dry run)
        if: hashFiles('release/scripts/migrate.cjs') != ''
        continue-on-error: true
        shell: bash
        working-directory: release
        env:
          SQL_SERVER: ${{ vars.SQL_SERVER }}
          SQL_DATABASE: ${{ vars.SQL_DATABASE }}
        run: |
          npm run migrate -- --dry-run | tee "$RUNNER_TEMP/pending-migrations.txt"
          {
            echo "### Pending migrations on ${APP_NAME}"
            echo '```'
            cat "$RUNNER_TEMP/pending-migrations.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
