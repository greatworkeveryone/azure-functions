name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install with scripts ignored
        run: npm ci --ignore-scripts
      # Reported but non-blocking. The outstanding high (brace-expansion, via
      # exceljs -> archiver -> minimatch) is unreachable: exceljs only requires
      # archiver from its streaming writer, which this repo never uses. See the
      # exceljs exception in CLAUDE.md before relaxing this further.
      - name: Audit production dependencies (high — informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production dependencies (critical — blocking)
        run: npm audit --omit=dev --audit-level=critical
      - name: Verify registry signatures
        run: npm audit signatures
